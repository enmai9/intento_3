<header class="bg-blue-900 text-white shadow-md">
  <div class="container mx-auto flex items-center justify-between px-4 py-3">
    <a routerLink="/inicio" class="flex items-center gap-2 text-xl font-bold tracking-wide">
      <span class="text-2xl">🎓</span>
      <span>Préstamos Universitarios</span>
    </a>

    <nav class="hidden items-center gap-6 text-sm font-medium md:flex">
      <a routerLink="/inicio" routerLinkActive="text-yellow-400" [routerLinkActiveOptions]="{ exact: true }" class="transition hover:text-yellow-300">Inicio</a>
      <a routerLink="/principal/equipos" routerLinkActive="text-yellow-400" class="transition hover:text-yellow-300">Equipos</a>
      <a routerLink="/principal/espacios" routerLinkActive="text-yellow-400" class="transition hover:text-yellow-300">Espacios</a>

      <ng-container *ngIf="userEmail; else noLogueado">
        <span class="border-l border-gray-600 pl-4 text-xs text-gray-300">Hola, {{ userEmail }}</span>
        <a *ngIf="isAdmin" routerLink="/admin" class="rounded bg-red-600 px-3 py-1.5 font-semibold text-white transition hover:bg-red-500">Panel Admin</a>
        <button (click)="logout()" class="rounded bg-gray-700 px-4 py-2 transition hover:bg-gray-600">Cerrar Sesión</button>
      </ng-container>

      <ng-template #noLogueado>
        <a routerLink="/inicio/login" class="rounded bg-yellow-500 px-4 py-2 font-bold text-blue-900 transition hover:bg-yellow-400">Iniciar Sesión</a>
      </ng-template>
    </nav>

    <button (click)="toggleMenu()" class="text-2xl focus:outline-none md:hidden" aria-label="Abrir menú">
      ☰
    </button>
  </div>

  <div *ngIf="isMenuOpen" class="space-y-3 border-t border-blue-700 bg-blue-800 px-4 py-4 text-sm md:hidden">
    <a routerLink="/inicio" class="block hover:text-yellow-300">Inicio</a>
    <a routerLink="/principal/equipos" class="block hover:text-yellow-300">Equipos</a>
    <a routerLink="/principal/espacios" class="block hover:text-yellow-300">Espacios</a>

    <hr class="border-blue-700" />

    <ng-container *ngIf="userEmail; else noLogueadoMovil">
      <span class="block text-xs text-gray-300">Sesión: {{ userEmail }}</span>
      <a *ngIf="isAdmin" routerLink="/admin" class="block text-red-200">Panel Admin</a>
      <button (click)="logout()" class="block text-left text-red-200">Cerrar Sesión</button>
    </ng-container>

    <ng-template #noLogueadoMovil>
      <a routerLink="/inicio/login" class="block font-bold text-yellow-300">Iniciar Sesión</a>
    </ng-template>
  </div>
</header>
